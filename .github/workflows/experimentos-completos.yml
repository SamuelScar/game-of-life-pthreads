name: Experimentos completos

on:
  workflow_dispatch:
    inputs:
      repeticoes:
        description: "Repetições por entrada predefinida"
        required: true
        default: "10"
        type: string
      threads_lista:
        description: "Quantidades de threads separadas por espaço"
        required: true
        default: "1 2 4 8"
        type: string

permissions:
  contents: read

concurrency:
  group: experimentos-completos
  cancel-in-progress: false

jobs:
  executar:
    name: Executar sequencial e Pthreads
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v7

      - name: Construir ambiente
        run: docker compose build dev

      - name: Validar comportamento das implementações
        env:
          THREADS_LISTA: ${{ inputs.threads_lista }}
        run: |
          docker compose run --rm -T \
            -e THREADS_LISTA \
            dev make validate

      - name: Executar série completa de experimentos
        id: experimentos
        env:
          REPETICOES: ${{ inputs.repeticoes }}
          THREADS_LISTA: ${{ inputs.threads_lista }}
        run: |
          docker compose run --rm -T \
            -e REPETICOES \
            -e THREADS_LISTA \
            -e GITHUB_ACTIONS \
            -e GITHUB_REPOSITORY \
            -e GITHUB_SHA \
            -e GITHUB_RUN_ID \
            -e GITHUB_RUN_ATTEMPT \
            -e RUNNER_NAME \
            dev make experiments-complete

      - name: Coletar perfil sequencial
        id: perfil
        if: steps.experimentos.outcome == 'success'
        run: |
          docker compose run --rm -T \
            dev make profile-sequential-detailed
          docker compose run --rm -T \
            dev make profile-sequential-gprof \
              INPUT=entradas/aleatorias/quadrada-256x256-d10-s602.txt

      - name: Gerar relatório final
        if: always()
        env:
          STATUS_EXECUCAO: ${{ steps.experimentos.outcome }}
          STATUS_PERFIL: ${{ steps.perfil.outcome }}
        run: |
          docker compose run --rm -T \
            -e STATUS_EXECUCAO \
            -e STATUS_PERFIL \
            -e GITHUB_ACTIONS \
            -e GITHUB_REPOSITORY \
            -e GITHUB_SHA \
            -e GITHUB_RUN_ID \
            -e GITHUB_RUN_ATTEMPT \
            -e RUNNER_NAME \
            dev bash scripts/gerar_relatorio_experimentos.sh

      - name: Publicar resumo da execução
        if: always()
        run: |
          relatorio="resultados/relatorio_experimentos.md"

          if [[ -f "$relatorio" ]]; then
            cat "$relatorio" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "O relatório dos experimentos não foi gerado." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Armazenar resultados
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: experimentos-completos-${{ github.run_id }}
          path: |
            entradas/classicos/
            entradas/aleatorias/
            entradas/desempenho/
            resultados/experimentos_completos/
            resultados/perfil_sequencial/
            resultados/relatorio_experimentos.md
          if-no-files-found: warn
          retention-days: 30
          compression-level: 9
