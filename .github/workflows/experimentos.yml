name: Experimentos sequenciais

on:
  workflow_dispatch:
    inputs:
      repeticoes:
        description: "Repetições por entrada predefinida"
        required: true
        default: "10"
        type: string

permissions:
  contents: read

concurrency:
  group: experimentos-sequenciais
  cancel-in-progress: false

jobs:
  executar:
    name: Executar experimentos sequenciais
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v7

      - name: Construir ambiente
        run: docker compose build dev

      - name: Executar série de experimentos
        id: experimentos
        env:
          REPETICOES: ${{ inputs.repeticoes }}
        run: |
          docker compose run --rm -T \
            -e REPETICOES \
            -e GITHUB_ACTIONS \
            -e GITHUB_REPOSITORY \
            -e GITHUB_SHA \
            -e GITHUB_RUN_ID \
            -e GITHUB_RUN_ATTEMPT \
            -e RUNNER_NAME \
            dev make experiments

      - name: Coletar perfil detalhado de memória e caches
        id: perfil
        if: steps.experimentos.outcome == 'success'
        run: |
          docker compose run --rm -T \
            dev bash scripts/coletar_perfil_detalhado.sh

      - name: Gerar relatório final
        if: always()
        env:
          STATUS_EXECUCAO: ${{ steps.experimentos.outcome }}
          STATUS_PERFIL: ${{ steps.perfil.outcome }}
        run: |
          docker compose run --rm -T \
            -e STATUS_EXECUCAO \
            -e STATUS_PERFIL \
            -e GITHUB_ACTIONS \
            -e GITHUB_REPOSITORY \
            -e GITHUB_SHA \
            -e GITHUB_RUN_ID \
            -e GITHUB_RUN_ATTEMPT \
            -e RUNNER_NAME \
            dev bash scripts/gerar_relatorio.sh

      - name: Publicar resumo da execução
        if: always()
        run: |
          relatorio="resultados/resumo_execucao.md"

          if [[ -f "$relatorio" ]]; then
            cat "$relatorio" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "O relatório dos experimentos não foi gerado." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Armazenar resultados
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: experimentos-sequenciais-${{ github.run_id }}
          path: |
            entradas/classicos/
            entradas/aleatorias/
            resultados/sequencial/execucoes.csv
            resultados/perfil/
            resultados/resumo_execucao.md
          if-no-files-found: warn
          retention-days: 30
          compression-level: 9
